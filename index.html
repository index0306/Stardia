<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D GENESIS ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #050505; color: white; margin: 0; }
        .glass { background: rgba(15, 15, 20, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #00ff88, #00aaff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="canvas"></div>

    <div class="fixed top-8 left-8 z-10 glass p-6 rounded-2xl w-80 shadow-2xl">
        <h1 class="text-xl font-black uppercase tracking-widest mb-1 gradient-text">3D Genesis</h1>
        <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-6">JSON to GLB Converter</p>
        
        <div id="dropZone" class="border-2 border-dashed border-gray-700 rounded-xl p-8 text-center cursor-pointer hover:border-green-500 transition-colors">
            <span class="text-sm">Перетащите .json сюда</span>
        </div>

        <button id="exportBtn" class="w-full mt-6 bg-white text-black font-bold py-3 rounded-lg hover:bg-green-400 transition-all transform active:scale-95 disabled:opacity-50" disabled>
            ЭКСПОРТ (GLB)
        </button>
        <div id="status" class="mt-4 text-[10px] text-gray-500 text-center">ОЖИДАНИЕ ФАЙЛА</div>
    </div>

    <script>
        // Setup Three.js Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas').appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(2, 2, 5);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        let importedMesh = null;

        // Logic
        const dropZone = document.getElementById('dropZone');
        const exportBtn = document.getElementById('exportBtn');
        const status = document.getElementById('status');

        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            const text = await file.text();
            try {
                const data = JSON.parse(text);
                processJSON(data);
                status.innerText = "ФАЙЛ ЗАГРУЖЕН: " + file.name;
                exportBtn.disabled = false;
            } catch(err) {
                status.innerText = "ОШИБКА JSON";
            }
        });

        function processJSON(data) {
            if(importedMesh) scene.remove(importedMesh);
            
            // Простой парсер: если в JSON массив вершин
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x00ff88, wireframe: false });
            importedMesh = new THREE.Mesh(geometry, material);
            scene.add(importedMesh);
        }

        exportBtn.addEventListener('click', () => {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(scene, (result) => {
                const blob = new Blob([JSON.stringify(result)], {type: 'application/json'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'model.glb';
                link.click();
            }, { binary: true });
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
